name: "Auto-fix LICENSES for Dependabot"

# Dependabot PRs run with a read-only GITHUB_TOKEN and no repo secrets, so a
# workflow triggered directly by `pull_request` can't push a fix commit back.
# We key off completion of "Validate PR Title" (which already runs on every
# dependabot PR) to get workflow_run's default-branch execution context.
#
# The job that checks out and builds the PR's code (license-scan) is kept
# read-only and never touches the write-scoped token. The job that pushes
# (commit-fix) never checks out or executes the PR's code at all -- it only
# writes the pre-computed LICENSES/ files from license-scan's artifact via
# the Git Data API, so a compromised dependency can't run with write access.
on:
  workflow_run:
    workflows: ["Validate PR Title"]
    types:
      - completed

permissions:
  contents: read

jobs:
  license-scan:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      head_sha: ${{ github.event.workflow_run.head_sha }}
      head_branch: ${{ github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # Never cache here: this job builds untrusted PR code, and
          # workflow_run cache writes are scoped to the default branch --
          # caching would let a malicious dependency poison a cache later
          # restored by a trusted run.
          cache: false

      - name: Regenerate LICENSES
        env:
          CGO_ENABLED: "0"
        run: make update-licenses

      - name: Compute diff manifest
        id: diff
        run: |
          set -euo pipefail
          changed=$(git status --porcelain --untracked-files=all -- . | awk '{print $2}')
          outside=$(echo "$changed" | grep -v '^LICENSES/' || true)
          if [ -n "$outside" ]; then
            echo "::error::update-licenses touched unexpected files, refusing to auto-fix:"
            echo "$outside"
            exit 1
          fi
          if [ -z "$changed" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git status --porcelain --untracked-files=all -- LICENSES > manifest.txt

      - uses: actions/upload-artifact@v4
        if: steps.diff.outputs.changed == 'true'
        with:
          name: licenses-fix
          path: |
            LICENSES
            manifest.txt

  commit-fix:
    needs: license-scan
    if: needs.license-scan.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ needs.license-scan.outputs.head_sha }}
      HEAD_BRANCH: ${{ needs.license-scan.outputs.head_branch }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: licenses-fix

      - name: Build tree, commit, and update ref via Git Data API
        run: |
          set -euo pipefail

          base_tree=$(gh api "repos/${REPO}/git/commits/${HEAD_SHA}" --jq .tree.sha)

          entries="[]"
          while IFS= read -r line; do
            status="${line:0:2}"
            path="${line:3}"
            if [[ "$status" == *D* ]]; then
              entries=$(jq -c --arg path "$path" \
                '. + [{path:$path, mode:"100644", type:"blob", sha:null}]' <<<"$entries")
            else
              blob_sha=$(gh api "repos/${REPO}/git/blobs" -f encoding="base64" \
                --raw-field content="$(base64 -w0 "$path")" --jq .sha)
              entries=$(jq -c --arg path "$path" --arg sha "$blob_sha" \
                '. + [{path:$path, mode:"100644", type:"blob", sha:$sha}]' <<<"$entries")
            fi
          done < manifest.txt

          new_tree=$(jq -n --arg base_tree "$base_tree" --argjson entries "$entries" \
            '{base_tree:$base_tree, tree:$entries}' | \
            gh api "repos/${REPO}/git/trees" --input - --jq .sha)

          new_commit=$(jq -n --arg tree "$new_tree" --arg parent "$HEAD_SHA" \
            '{message:"maint: update LICENSES for dependency changes", tree:$tree, parents:[$parent]}' | \
            gh api "repos/${REPO}/git/commits" --input - --jq .sha)

          jq -n --arg sha "$new_commit" '{sha:$sha, force:false}' | \
            gh api "repos/${REPO}/git/refs/heads/${HEAD_BRANCH}" -X PATCH --input -
