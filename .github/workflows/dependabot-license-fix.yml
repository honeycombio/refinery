name: "Auto-fix LICENSES for Dependabot"

# Dependabot PRs run with a read-only GITHUB_TOKEN and no repo secrets, so a
# workflow triggered directly by `pull_request` can't push a fix commit back.
# Instead we key off completion of "Validate PR Title", which already runs
# (successfully) on every dependabot PR, and re-run in default-branch context
# where the token has write access.
on:
  workflow_run:
    workflows: ["Validate PR Title"]
    types:
      - completed

permissions:
  contents: write

jobs:
  fix-licenses:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Regenerate LICENSES
        run: make update-licenses

      - name: Verify only LICENSES/ changed
        run: |
          changed=$(git status --porcelain | awk '{print $2}')
          if [ -z "$changed" ]; then
            echo "LICENSES already up to date, nothing to do."
            exit 0
          fi
          outside=$(echo "$changed" | grep -v '^LICENSES/' || true)
          if [ -n "$outside" ]; then
            echo "::error::update-licenses touched unexpected files, refusing to auto-commit:"
            echo "$outside"
            exit 1
          fi

      - name: Commit and push fix
        run: |
          if git diff --quiet && git diff --cached --quiet -- LICENSES; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LICENSES
          git commit -m "maint: update LICENSES for dependency changes"
          git push origin HEAD:${{ github.event.workflow_run.head_branch }}
