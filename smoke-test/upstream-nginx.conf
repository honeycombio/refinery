# A fake Honeycomb API that requires a client certificate signed by the smoke-test CA.

log_format mtls 'mtls verify=$ssl_client_verify dn="$ssl_client_s_dn" $request_method $uri';

server {
    listen 8443 ssl;
    http2 on;
    ssl_certificate /certs/upstream.pem;
    ssl_certificate_key /certs/upstream-key.pem;
    ssl_client_certificate /certs/ca.pem;
    ssl_verify_client on;

    access_log /dev/stdout mtls;
    default_type application/json;

    location /1/auth {
        return 200 '{"api_key_access":{"events":true},"team":{"slug":"smoke"},"environment":{"slug":"smoke","name":"smoke"},"id":"smoke"}';
    }

    location /1/batch/ {
        return 200 '[{"status":202}]';
    }
}
